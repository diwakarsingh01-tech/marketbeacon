    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" media="print" onload="this.media='all'" />

    <script defer>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(r) { for(let reg of r) reg.unregister(); });
        }
        if ('caches' in window) {
          caches.keys().then(function(n) { for (let name of n) caches.delete(name); });
        }
        localStorage.removeItem('mb_api_override');
      })();
    </script>
    <!-- GA4: Set VITE_GA_ID in .env to enable -->
    <script defer>
      (function() {
        var gaId = '%VITE_GA_ID%';
        if (gaId && gaId !== '%VITE' + '_GA_ID%') {
          window.dataLayer = window.dataLayer || [];
          function gtag(){dataLayer.push(arguments);}
          gtag('js', new Date());
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=' + gaId;
          document.head.appendChild(s);
          gtag('config', gaId, { anonymize_ip: true });
        }
      })();
    </script>
    <!-- Search Console verified via hardcoded meta tag above -->
    <!-- Meta Pixel: Set VITE_META_PIXEL_ID in .env to enable -->
    <script defer>
      (function() {
        var pixelId = '%VITE_META_PIXEL_ID%';
        if (pixelId && pixelId !== '%VITE' + '_META_PIXEL_ID%') {
          !function(f,b,e,v,n,t,s)
          {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
          n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
          n.queue=[];t=b.createElement(e);t.async=!0;
          t.src='https://connect.facebook.net/en_US/fbevents.js';
          s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)}(window, document,'script');
          fbq('init', pixelId);
          fbq('track', 'PageView');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
