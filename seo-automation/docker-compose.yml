version: '3.8'

services:
  seo-automation:
    build: .
    volumes:
      - ./audit:/app/audit
      - ./output:/app/output
      - ./content:/app/content
      - ./templates:/app/templates
      - ./scripts:/app/scripts
    environment:
      - WP_CLI_AUTH_TOKEN=${WP_CLI_AUTH_TOKEN}
      - WP_CLI_URL=${WP_CLI_URL}
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - LLM_ENDPOINT=${LLM_ENDPOINT}
      - LLM_API_KEY=${LLM_API_KEY}
    command: ["python", "scripts/generate_metadata.py"]
