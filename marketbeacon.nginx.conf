# MarketBeacon Pro - nginx Configuration
# Deploy to: /etc/nginx/sites-available/marketbeaconpro.com
# Then: ln -s /etc/nginx/sites-available/marketbeaconpro.com /etc/nginx/sites-enabled/
# Then: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name www.marketbeaconpro.com;
    return 301 https://marketbeaconpro.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.marketbeaconpro.com;
    ssl_certificate /etc/letsencrypt/live/marketbeaconpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketbeaconpro.com/privkey.pem;
    return 301 https://marketbeaconpro.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name marketbeaconpro.com;

    ssl_certificate /etc/letsencrypt/live/marketbeaconpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketbeaconpro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/marketbeacon/frontend/dist;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # Static assets: 1-year immutable cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Favicon, manifest, OG preview: cache 1 day
    location ~* \.(svg|ico|json|webmanifest)$ {
        expires 1d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Prerendered pages: serve static HTML files
    location /blog/ {
        try_files $uri/index.html $uri /index.html;
    }

    location /pricing/ {
        try_files $uri/index.html $uri /index.html;
    }

    location /login/ {
        try_files $uri/index.html $uri /index.html;
    }

    location /privacy-policy/ {
        try_files $uri/index.html $uri /index.html;
    }

    location /analysis/ {
        try_files $uri /index.html;
    }

    # API proxy to backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA fallback: serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    access_log /var/log/nginx/marketbeacon_access.log;
    error_log /var/log/nginx/marketbeacon_error.log;
}
